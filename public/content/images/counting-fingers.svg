<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180"><rect fill="#fef3c7" width="400" height="180"/><text x="200" y="32" text-anchor="middle" font-size="16" font-weight="600" font-family="Segoe UI,sans-serif">Count with touch</text><text x="200" y="110" text-anchor="middle" font-size="48">1️⃣ 2️⃣ 3️⃣ 4️⃣ 5️⃣</text><text x="200" y="155" text-anchor="middle" font-size="13">One tap = one number</text></svg>