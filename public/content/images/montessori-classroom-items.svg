<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img">
  <title>Things found in a Montessori environment</title>
  <rect width="900" height="520" fill="#fafaf9"/>
  <text x="450" y="36" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#292524">Things children see and use every day</text>
  <g font-family="Segoe UI,sans-serif" font-size="13" fill="#44403c">
    <rect x="40" y="60" width="190" height="130" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="135" y="88" text-anchor="middle" font-weight="600">Work mat / rug</text>
    <rect x="70" y="100" width="130" height="8" fill="#6ee7b7" rx="2"/>
    <text x="135" y="165" text-anchor="middle">Defines personal workspace</text>

    <rect x="250" y="60" width="190" height="130" rx="10" fill="#fef3c7" stroke="#fde68a"/>
    <text x="345" y="88" text-anchor="middle" font-weight="600">Low shelves</text>
    <rect x="280" y="100" width="130" height="60" fill="#fcd34d" rx="4"/>
    <line x1="290" y1="115" x2="400" y2="115" stroke="#b45309" stroke-width="2"/>
    <line x1="290" y1="130" x2="400" y2="130" stroke="#b45309" stroke-width="2"/>
    <text x="345" y="165" text-anchor="middle">Materials at child height</text>

    <rect x="460" y="60" width="190" height="130" rx="10" fill="#fce7f3" stroke="#fbcfe8"/>
    <text x="555" y="88" text-anchor="middle" font-weight="600">Pink tower</text>
    <rect x="530" y="130" width="50" height="25" fill="#fda4af"/>
    <rect x="520" y="105" width="70" height="22" fill="#fb7185"/>
    <rect x="505" y="82" width="100" height="20" fill="#f43f5e"/>
    <text x="555" y="165" text-anchor="middle">Sensorial grading</text>

    <rect x="670" y="60" width="190" height="130" rx="10" fill="#e0e7ff" stroke="#c7d2fe"/>
    <text x="765" y="88" text-anchor="middle" font-weight="600">Pouring tray</text>
    <ellipse cx="735" cy="120" rx="22" ry="14" fill="#93c5fd"/>
    <path d="M760 115 L785 105 L785 125 Z" fill="#60a5fa"/>
    <rect x="720" y="130" width="90" height="35" fill="#dbeafe" rx="4"/>
    <text x="765" y="165" text-anchor="middle">Practical life</text>

    <rect x="40" y="210" width="190" height="130" rx="10" fill="#f3e8ff" stroke="#e9d5ff"/>
    <text x="135" y="238" text-anchor="middle" font-weight="600">Sandpaper letters</text>
    <text x="135" y="280" text-anchor="middle" font-size="48" fill="#7c3aed" font-family="Georgia,serif">Aa</text>
    <text x="135" y="315" text-anchor="middle">Touch + sound</text>

    <rect x="250" y="210" width="190" height="130" rx="10" fill="#ffedd5" stroke="#fed7aa"/>
    <text x="345" y="238" text-anchor="middle" font-weight="600">Number rods</text>
    <rect x="280" y="270" width="120" height="12" fill="#ea580c"/>
    <rect x="295" y="252" width="90" height="12" fill="#f97316"/>
    <rect x="310" y="234" width="60" height="12" fill="#fb923c"/>
    <text x="345" y="315" text-anchor="middle">Quantity + length</text>

    <rect x="460" y="210" width="190" height="130" rx="10" fill="#ccfbf1" stroke="#99f6e4"/>
    <text x="555" y="238" text-anchor="middle" font-weight="600">Child-sized chair</text>
    <rect x="510" y="255" width="90" height="55" fill="#5eead4" rx="6"/>
    <rect x="525" y="240" width="60" height="18" fill="#14b8a6" rx="4"/>
    <text x="555" y="315" text-anchor="middle">Independence</text>

    <rect x="670" y="210" width="190" height="130" rx="10" fill="#f5f5f4" stroke="#d6d3d1"/>
    <text x="765" y="238" text-anchor="middle" font-weight="600">Hand-wash station</text>
    <rect x="720" y="255" width="90" height="50" fill="#e7e5e4" rx="4"/>
    <circle cx="765" cy="272" r="10" fill="#38bdf8"/>
    <text x="765" y="315" text-anchor="middle">Care of self</text>

    <rect x="145" y="360" width="610" height="130" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="450" y="392" text-anchor="middle" font-weight="600" font-size="16">Also in the room: plant, clock, art, books, peace corner, shoe area</text>
    <text x="450" y="420" text-anchor="middle">Ask your child to point to each area on their next school day.</text>
    <text x="450" y="455" text-anchor="middle" font-size="12" fill="#78716c">Photos in school may differ; names stay the same.</text>
  </g>
</svg>
